# Render Blueprint for the RecurIQ API (free plan).
# In Render: New > Blueprint > pick this repo. Render asks for the values marked "sync: false".
# To turn on the AI analyst, add GROQ_API_KEY afterwards under the service's Environment tab.
# Full walkthrough: docs/DEPLOY.md

services:
  - type: web
    name: recuriq-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/customer/plans/all
    autoDeployTrigger: commit
    envVars:
      # MySQL connection, e.g. jdbc:mysql://HOST:PORT/subscription_billing?sslMode=REQUIRED
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Browser origins allowed to call the API. Narrow this to your own Vercel URL if you like.
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app
