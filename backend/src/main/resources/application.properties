
# MySQL settings
#Change these settings according to database you are using
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/subscription_billing}

spring.datasource.username=${DB_USERNAME:root}

#If MySQL installation is password proctored,then use below property to set password
spring.datasource.password=${DB_PASSWORD:root}

#JPA settings
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8765


server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.timeout=30m

# Debug logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

spring.graphql.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# AI billing assistant (Anthropic Claude). Leave the key unset to switch the assistant off.
recuriq.ai.api-key=${ANTHROPIC_API_KEY:}
recuriq.ai.model=${RECURIQ_AI_MODEL:claude-opus-5-5}
