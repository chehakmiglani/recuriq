# Local secrets (API keys, DB password) can live in a .env file at the project root or in backend/.
# Both are optional and git-ignored; real environment variables still take precedence.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# MySQL settings
#Change these settings according to database you are using
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/subscription_billing}

spring.datasource.username=${DB_USERNAME:root}

#If MySQL installation is password proctored,then use below property to set password
spring.datasource.password=${DB_PASSWORD:root}

#JPA settings
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Hosts such as Render provide the port through PORT
server.port=${PORT:8765}


server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.timeout=30m

# Debug logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Browser origins allowed to call the API (comma-separated). Add your hosted frontend URL here.
recuriq.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# AI analyst. Set GROQ_API_KEY (free tier) or ANTHROPIC_API_KEY; with neither, AI features are off.
# provider: auto (Groq if its key is set, otherwise Claude), groq or anthropic
recuriq.ai.provider=${RECURIQ_AI_PROVIDER:auto}
recuriq.ai.groq.api-key=${GROQ_API_KEY:}
recuriq.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
recuriq.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
recuriq.ai.anthropic.model=${CLAUDE_MODEL:claude-opus-5-5}
